<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>
  // ホーム画面ショートカット「index.html?view=stats」から統計画面へ
  if (/[?&]view=stats\b/.test(location.search)) location.replace('stats.html');
</script>
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>単語カード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="progress">- / -</div>
  <div id="daily"></div>
  <div class="header-right">
    <a id="statsLink" class="hbtn" href="stats.html" aria-label="学習記録">📊</a>
    <button id="filterBtn" class="hbtn">絞り込み<span id="filterBadge" hidden></span></button>
    <button id="reload" class="hbtn" aria-label="同期">⟳</button>
  </div>
</header>

<main id="stage">
  <div id="card" class="card">
    <div class="face front">
      <div class="tag" id="tag"></div>
      <div class="word" id="en"></div>
      <div class="ipa" id="ipa"></div>
      <button class="speak" id="speakEn" aria-label="発音">🔊</button>
      <div class="hint">タップで裏返す</div>
    </div>
    <div class="face back">
      <div class="word ja" id="ja"></div>
      <div class="sec" id="exampleBox"><div class="label">例文 <button class="speak sm" id="speakEx" aria-label="例文を発音">🔊</button></div><div class="example" id="example"></div></div>
      <div class="sec" id="noteBox"><div class="label">備考 <button class="speak sm" id="speakNote" aria-label="備考を発音">🔊</button></div><div class="note" id="note"></div></div>
      <div class="sec" id="sourceBox"><div class="label">出典</div><a id="sourceLink" class="source"></a></div>
    </div>
  </div>
  <div id="empty" hidden>表示できる単語がありません 🎉</div>
</main>

<footer>
  <button id="prev" class="nav" aria-label="前へ">‹</button>
  <button id="again" class="again">まだ</button>
  <button id="done" class="done">覚えた ✓</button>
  <button id="next" class="nav" aria-label="次へ">›</button>
</footer>

<div id="sheetBg" hidden></div>
<section id="sheet" hidden>
  <h2>絞り込み</h2>
  <div class="row">
    <div class="label">表示する単語</div>
    <div class="seg" id="statusSeg">
      <button data-v="today">今日</button>
      <button data-v="new">新規</button>
      <button data-v="due">復習</button>
      <button data-v="done">覚えた</button>
      <button data-v="all">すべて</button>
    </div>
    <div class="subnote" id="statusNote"></div>
  </div>
  <div class="row">
    <div class="label">出典</div>
    <select id="sourceSel"></select>
  </div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="shuffle"> ランダム順</label>
    <label class="toggle" style="margin-left:16px"><input type="checkbox" id="autoSpeak"> 自動で発音</label>
  </div>
  <div class="actions">
    <button id="filterReset">リセット</button>
    <button id="filterClose" class="primary">閉じる</button>
  </div>
</section>

<div id="quoteBg" hidden></div>
<section id="quoteBox" class="quote" hidden>
  <div class="qhead">今日の名言</div>
  <div class="qtext" id="qText"></div>
  <div class="qja" id="qJa"></div>
  <div class="qby" id="qBy"></div>
  <div class="qactions">
    <button class="speak sm" id="qSpeak" aria-label="読み上げ">🔊</button>
    <button id="qClose" class="primary">今日も始めよう</button>
  </div>
</section>

<div id="toast"></div>
<script src="config.js"></script>
<script src="quotes.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
