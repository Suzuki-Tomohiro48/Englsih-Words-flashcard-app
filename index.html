<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>
/* ===== デバッグ: エラーを画面に直接表示（ウォッチ等Consoleが見られない環境用）。不要になったらこの<script>を削除 ===== */
(function () {
  var box;
  function show(msg) {
    try {
      if (!box) {
        box = document.createElement('pre');
        box.id = 'errBox';
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:60%;overflow:auto;margin:0;padding:6px;' +
          'background:#7f1d1dee;color:#fff;font:10px/1.3 monospace;white-space:pre-wrap;word-break:break-all;z-index:99999';
        box.onclick = function () { box.style.display = 'none'; };   // タップで閉じる
        (document.body || document.documentElement).appendChild(box);
      }
      box.style.display = 'block';
      box.textContent += msg + '\n';
    } catch (e) {}
  }
  window.__showError = show;
  window.addEventListener('error', function (e) {
    show('[error] ' + (e.message || 'unknown') + (e.filename ? '\n  @' + String(e.filename).split('/').pop() + ':' + e.lineno + ':' + e.colno : '') +
      (e.error && e.error.stack ? '\n' + e.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason; show('[promise] ' + (r && r.message ? r.message : r) + (r && r.stack ? '\n' + r.stack : ''));
  });
  // ウォッチ判定: 実機は viewport が広く報告されることがあるため、複数の幅の最小値で判定
  function vw() {
    var a = [window.innerWidth, document.documentElement && document.documentElement.clientWidth, window.screen && window.screen.width]
      .filter(function (n) { return n > 0; });
    return a.length ? Math.min.apply(null, a) : 9999;
  }
  window.__vw = vw;
  window.__applyWatch = function () {
    var f = (location.search.match(/[?&]watch=(\d)/) || [])[1];
    var on = f === '1' || (f !== '0' && vw() <= 450);
    document.documentElement.className = document.documentElement.className.replace(/\bwatch\b/g, '').trim() + (on ? ' watch' : '');
    return on;
  };
  window.__applyWatch();
  if (/[?&]debug=1/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', function () {
      show('[debug] w=' + window.innerWidth + ' cw=' + document.documentElement.clientWidth + ' sw=' + (window.screen && screen.width) +
        ' dpr=' + window.devicePixelRatio + ' watch=' + /\bwatch\b/.test(document.documentElement.className) + '\nUA=' + navigator.userAgent);
    });
  }
})();
</script>
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>単語カード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div id="progress">- / -</div>
  <div class="header-right">
    <button id="filterBtn" class="hbtn">絞り込み<span id="filterBadge" hidden></span></button>
    <button id="reload" class="hbtn" aria-label="同期">⟳</button>
  </div>
</header>

<main id="stage">
  <div id="card" class="card">
    <div class="face front">
      <div class="word" id="en"></div>
      <div class="ipa" id="ipa"></div>
      <button class="speak" id="speakEn" aria-label="発音">🔊</button>
      <div class="hint">タップで裏返す</div>
    </div>
    <div class="face back">
      <div class="word ja" id="ja"></div>
      <div class="sec" id="exampleBox"><div class="label">例文 <button class="speak sm" id="speakEx" aria-label="例文を発音">🔊</button></div><div class="example" id="example"></div></div>
      <div class="sec" id="noteBox"><div class="label">備考</div><div class="note" id="note"></div></div>
      <div class="sec" id="sourceBox"><div class="label">出典</div><a id="sourceLink" class="source"></a></div>
    </div>
  </div>
  <div id="empty" hidden>表示できる単語がありません 🎉</div>
</main>

<footer>
  <button id="prev" class="nav">‹</button>
  <button id="done" class="done">覚えた ✓</button>
  <button id="next" class="nav">›</button>
</footer>

<div id="sheetBg" hidden></div>
<section id="sheet" hidden>
  <h2>絞り込み</h2>
  <div class="row">
    <div class="label">暗記状況</div>
    <div class="seg" id="statusSeg">
      <button data-v="todo">まだ</button>
      <button data-v="done">覚えた</button>
      <button data-v="all">すべて</button>
    </div>
  </div>
  <div class="row">
    <div class="label">出典</div>
    <select id="sourceSel"></select>
  </div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="shuffle"> ランダム順</label>
    <label class="toggle" style="margin-left:16px"><input type="checkbox" id="autoSpeak"> 自動で発音</label>
  </div>
  <div class="actions">
    <button id="filterReset">リセット</button>
    <button id="filterClose" class="primary">閉じる</button>
  </div>
</section>

<div id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
